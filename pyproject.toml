[project]
name = "icarus-dcc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "maya-stubs>=0.4.2",
    "pyside2>=5.15.2.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "sphinx>=8.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icarus_dcc"]
[tool.ruff]
line-length = 100
target-version = 'py310'
extend-exclude = [
    "rez/packages",
]

